name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again -- the older result is
# about code nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default token only ever needs to read this repository here. Stated explicitly
# because the repo-wide default may be broader, and nothing in this workflow writes.
permissions:
  contents: read

jobs:
  # Developer Certificate of Origin: every commit in a pull request must carry a
  # Signed-off-by trailer. Implemented inline rather than with a third-party action,
  # because a public repo should not hand a marketplace action a token to enforce a rule
  # this small. Kept identical to the model-client workflow so contributors meet the same
  # rule in both repositories.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the base and head commits both have to be present to diff them.
          fetch-depth: 0

      - name: Check sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          # --no-merges: a merge commit is generated by the person merging, not authored,
          # so requiring a certification on it would be meaningless.
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi
          for sha in $commits; do
            subject=$(git log -1 --format='%s' "$sha")
            author_email=$(git log -1 --format='%ae' "$sha")
            signoffs=$(git log -1 --format='%B' "$sha" \
              | grep -i '^Signed-off-by: .\+ <.\+@.\+>' || true)
            if [ -z "$signoffs" ]; then
              echo "::error::${sha:0:8} (\"$subject\") has no Signed-off-by line."
              status=1
              continue
            fi
            # The sign-off should be the commit's own author certifying their work. A
            # mismatch is usually a GitHub noreply address or a work/personal email split,
            # which is a warning rather than a failure -- the certification still stands.
            if ! printf '%s' "$signoffs" | grep -qiF "<$author_email>"; then
              echo "::warning::${sha:0:8} is signed off, but not by its author" \
                   "($author_email). Check that this is intentional."
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Contributions are accepted under the Developer Certificate of Origin"
            echo "(https://developercertificate.org/). Sign your commits with 'git commit -s'."
            echo "To fix the most recent commit:      git commit --amend -s"
            echo "To fix several:                     git rebase --signoff $BASE_SHA"
            echo "Then force-push the branch."
          fi
          exit "$status"

  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel 3.13 because 3.12 failed -- "which versions broke" is the useful
      # answer, and it costs one extra job to get it.
      fail-fast: false
      matrix:
        # Every version the classifiers in pyproject.toml claim support for. A claim
        # nothing tests is a guess, so the two lists are kept in step.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --locked fails rather than silently relocking, so CI tests the dependency set that
      # is committed. That includes corbelity-model-client, which uv.lock pins to a
      # specific commit: a fix pushed there does NOT reach this workflow until someone
      # reruns `uv lock` here. That is reproducibility working as intended, not a bug, but
      # it does mean the two repositories can drift until relocked.
      #
      # Unlike model-client there is no extras matrix: the workbench UI offers every
      # provider, so it always installs corbelity-model-client[all].
      - name: Install
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      # pytest is configured with filterwarnings = ["error"], so a deprecation warning
      # from our own code fails here rather than surfacing on a later dependency bump.
      - name: Test
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      # The failure this exists to catch: the UI is data files, not Python, so a packaging
      # mistake does not break the build or any test -- `uv run corbelity-workbench` keeps
      # working from the source tree while an INSTALLED copy serves a blank page or 500s
      # on the favicon route. Nothing else in this workflow would notice.
      - name: Verify the UI is inside the wheel
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          echo "Inspecting $wheel"
          contents=$(unzip -Z1 "$wheel")
          missing=0
          for asset in index.html app.js style.css favicon.png corbelity-mark.png; do
            if printf '%s\n' "$contents" \
              | grep -qx "corbelity/workbench/static/$asset"; then
              echo "  ok       $asset"
            else
              echo "::error::$asset is missing from the wheel."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Static assets ship via [tool.hatch.build.targets.wheel] packages in"
            echo "pyproject.toml. Everything under src/corbelity should be included."
            echo ""
            echo "Wheel contents:"
            printf '%s\n' "$contents"
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

# Keeps GitHub Actions and Python dependencies current without manual attention.
# Mirrors the model-client configuration so both repositories age the same way.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # One pull request for all action bumps rather than one per action -- they are
      # almost always safe together, and separate PRs are pure review overhead.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "deps"
